services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_server
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/usuario-service/init-db/01-init-users.sql:/docker-entrypoint-initdb.d/01-init-users.sql:ro
      - ./Backend/pedido-service/init-db/01-init-orders.sql:/docker-entrypoint-initdb.d/01-init-orders.sql:ro
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservicios-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - microservicios-network

  usuario-service:
    build: ./Backend/usuario-service
    ports:
      - "8083:8081"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USERNAME: usuario_user
      DB_PASSWORD: usuario_pass
      MIGRATION_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - microservicios-network

  pedido-service:
    build: ./Backend/pedido-service
    ports:
      - "8082:8080"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: orders_db
      DB_USER: pedido_user
      DB_PASSWORD: pedido_pass
      MIGRATION_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - microservicios-network

  frontend:
    build: ./Frontend
    ports:
      - "3000:80"
    depends_on:
      - usuario-service
      - pedido-service
    networks:
      - microservicios-network

networks:
  microservicios-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local