version: '3.8'

services:
  # PostgreSQL Database for pedido-service
  postgres:
    image: postgres:15-alpine
    container_name: orders_db
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: pedido_user
      POSTGRES_PASSWORD: pedido_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/pedido-service/init-db:/docker-entrypoint-initdb.d
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedido_user -d orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - microservicios-network

  usuario-service:
    build: ./Backend/usuario-service
    ports:
      - "8083:8081"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - USERS_FILE=/data/users.json
    volumes:
      - ./Backend/usuario-service/data:/data
    depends_on:
      - rabbitmq
    networks:
      - microservicios-network

  pedido-service:
    build: ./Backend/pedido-service
    ports:
      - "8082:8080"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=orders_db
      - DB_USER=pedido_user
      - DB_PASSWORD=pedido_pass
      - MIGRATION_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - microservicios-network

  frontend:
    build: ./Frontend
    ports:
      - "3000:80"
    depends_on:
      - usuario-service
      - pedido-service
    networks:
      - microservicios-network

networks:
  microservicios-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

