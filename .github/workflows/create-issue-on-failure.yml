name: Create Issue on Individual Test Failure

on:
  workflow_call:
    inputs:
      test-type:
        required: true
        type: string
        description: 'Type of test (unit, integration-component, integration-services)'
      service-name:
        required: true
        type: string
        description: 'Name of the service (pedido, usuario, frontend, all)'
      workflow-name:
        required: true
        type: string
        description: 'Name of the workflow that failed'

jobs:
  create-issue:
    name: Create Issue
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const testType = '${{ inputs.test-type }}';
            const serviceName = '${{ inputs.service-name }}';
            const workflowName = '${{ inputs.workflow-name }}';
            
            // Mapeo de tipos de test a emoji y descripción
            const testTypeMap = {
              'unit': {
                emoji: '🧪',
                label: 'unit-tests',
                description: 'Unit Tests'
              },
              'integration-component': {
                emoji: '🔧',
                label: 'integration-tests',
                description: 'Component Integration Tests'
              },
              'integration-services': {
                emoji: '🌐',
                label: 'e2e-tests',
                description: 'Service Integration (E2E) Tests'
              }
            };

            const testInfo = testTypeMap[testType] || { emoji: '❌', label: 'test-failure', description: 'Tests' };
            
            const title = `${testInfo.emoji} ${testInfo.description} Failed: ${serviceName}`;
            
            let body = `## ${testInfo.emoji} ${testInfo.description} Failed\n\n`;
            body += `**Service:** \`${serviceName}\`\n`;
            body += `**Workflow:** [\`${workflowName}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            body += `**Run Number:** #${{ github.run_number }}\n`;
            body += `**Commit:** [\`${context.sha.substring(0, 7)}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\n`;
            body += `**Branch:** \`${{ github.ref_name }}\`\n`;
            body += `**Triggered by:** @${{ github.actor }}\n`;
            body += `**Event:** \`${{ github.event_name }}\`\n\n`;

            body += `### 🔍 What Happened?\n\n`;
            body += `The ${testInfo.description.toLowerCase()} for **${serviceName}** service failed during the CI pipeline.\n\n`;

            body += `### 📋 Next Steps\n\n`;
            body += `1. [View the workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            body += `2. Identify the failing test(s)\n`;
            body += `3. Fix the issue locally\n`;
            body += `4. Run tests locally to verify:\n`;
            
            if (testType === 'unit') {
              if (serviceName === 'frontend') {
                body += `   \`\`\`bash\n   cd Frontend\n   npm test\n   \`\`\`\n`;
              } else {
                body += `   \`\`\`bash\n   cd Backend/${serviceName}-service\n   mvn test\n   \`\`\`\n`;
              }
            } else if (testType === 'integration-component') {
              if (serviceName === 'frontend') {
                body += `   \`\`\`bash\n   cd Frontend\n   npm run test:integration\n   \`\`\`\n`;
              } else {
                body += `   \`\`\`bash\n   cd Backend/${serviceName}-service\n   mvn verify\n   \`\`\`\n`;
              }
            } else if (testType === 'integration-services') {
              body += `   \`\`\`bash\n   docker compose up -d\n   cd tests/e2e\n   npm test\n   \`\`\`\n`;
            }
            
            body += `5. Push the fix to trigger a new CI run\n\n`;

            body += `---\n`;
            body += `*This issue was automatically created by the CI pipeline when tests failed.*`;

            // Crear el issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['ci-failure', testInfo.label, 'automated']
            });

            console.log(`Created issue #${issue.data.number}: ${issue.data.html_url}`);
