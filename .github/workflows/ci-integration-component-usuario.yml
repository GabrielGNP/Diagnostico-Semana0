name: usuario-service - Component Integration Tests

on:
  workflow_call:

jobs:
  component-integration:
    name: Run Component Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/usuario-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run integration tests
        run: mvn -B verify -DskipUnitTests

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usuario-component-integration-results
          path: Backend/usuario-service/target/failsafe-reports/

