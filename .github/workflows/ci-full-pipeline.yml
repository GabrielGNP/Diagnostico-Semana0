name: Full CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  issues: write

jobs:
  # ============================================
  # STAGE 1: Unit Tests (en paralelo)
  # ============================================
  unit-pedido:
    name: Pedido Unit Tests
    uses: ./.github/workflows/ci-unit-pedido.yml

  unit-frontend:
    name: Frontend Unit Tests
    uses: ./.github/workflows/ci-unit-frontend.yml

  # ============================================
  # STAGE 2: Component Integration (en paralelo, necesita unitarios)
  # ============================================
  integration-pedido:
    name: Pedido Component Integration
    needs: [unit-pedido]
    uses: ./.github/workflows/ci-integration-component-pedido.yml

  integration-frontend:
    name: Frontend Component Integration
    needs: [unit-frontend]
    uses: ./.github/workflows/ci-integration-component-frontend.yml
