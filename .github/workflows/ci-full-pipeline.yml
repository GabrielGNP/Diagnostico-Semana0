name: Full CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  issues: write

jobs:
  # ============================================
  # STAGE 1: Unit Tests (en paralelo)
  # ============================================
  unit-pedido:
    name: Pedido Unit Tests
    uses: ./.github/workflows/ci-unit-pedido.yml

  unit-usuario:
    name: Usuario Unit Tests
    uses: ./.github/workflows/ci-unit-usuario.yml

  unit-frontend:
    name: Frontend Unit Tests
    uses: ./.github/workflows/ci-unit-frontend.yml

  # ============================================
  # STAGE 2: Component Integration (en paralelo, necesita unitarios)
  # ============================================
  integration-pedido:
    name: Pedido Component Integration
    needs: [unit-pedido]
    uses: ./.github/workflows/ci-integration-component-pedido.yml

  integration-usuario:
    name: Usuario Component Integration
    needs: [unit-usuario]
    uses: ./.github/workflows/ci-integration-component-usuario.yml

  integration-frontend:
    name: Frontend Component Integration
    needs: [unit-frontend]
    uses: ./.github/workflows/ci-integration-component-frontend.yml

  # ============================================
  # STAGE 3: Service Integration (necesita todo lo anterior)
  # ============================================
  integration-services:
    name: Full Service Integration
    needs: [integration-pedido, integration-usuario, integration-frontend]
    uses: ./.github/workflows/ci-integration-services.yml

  # ============================================
  # ISSUE CREATION: Crea un Issue si algún test falla
  # ============================================
  create-issue-on-failure:
    name: Create Issue on Test Failure
    runs-on: ubuntu-latest
    needs: [unit-pedido, unit-usuario, unit-frontend, integration-pedido, integration-usuario, integration-frontend, integration-services]
    if: failure()
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Create detailed failure issue
        uses: actions/github-script@v7
        with:
          script: |
            // Detectar qué jobs fallaron
            const failedJobs = [];
            const jobResults = {
              'unit-pedido': '${{ needs.unit-pedido.result }}',
              'unit-usuario': '${{ needs.unit-usuario.result }}',
              'unit-frontend': '${{ needs.unit-frontend.result }}',
              'integration-pedido': '${{ needs.integration-pedido.result }}',
              'integration-usuario': '${{ needs.integration-usuario.result }}',
              'integration-frontend': '${{ needs.integration-frontend.result }}',
              'integration-services': '${{ needs.integration-services.result }}'
            };

            // Clasificar por tipo de test
            const unitTestsFailed = [];
            const componentIntegrationFailed = [];
            const serviceIntegrationFailed = [];

            for (const [job, result] of Object.entries(jobResults)) {
              if (result === 'failure') {
                failedJobs.push(job);
                
                if (job.startsWith('unit-')) {
                  unitTestsFailed.push(job.replace('unit-', ''));
                } else if (job.startsWith('integration-') && job !== 'integration-services') {
                  componentIntegrationFailed.push(job.replace('integration-', ''));
                } else if (job === 'integration-services') {
                  serviceIntegrationFailed.push('E2E Service Integration');
                }
              }
            }

            if (failedJobs.length === 0) {
              console.log('No failed jobs detected, skipping issue creation');
              return;
            }

            // Construir el título
            const title = `CI Failed: ${failedJobs.length} test group${failedJobs.length > 1 ? 's' : ''} failed`;

            // Construir el cuerpo del issue
            let body = `## 🔴 CI Pipeline Failed\n\n`;
            body += `**Workflow:** [\`${{ github.workflow }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            body += `**Run Number:** #${{ github.run_number }}\n`;
            body += `**Commit:** [\`${context.sha.substring(0, 7)}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\n`;
            body += `**Branch:** \`${{ github.ref_name }}\`\n`;
            body += `**Triggered by:** @${{ github.actor }}\n`;
            body += `**Event:** \`${{ github.event_name }}\`\n\n`;

            // Resumen de fallos por categoría
            body += `### 📊 Failed Test Summary\n\n`;
            
            if (unitTestsFailed.length > 0) {
              body += `#### ❌ Unit Tests Failed\n`;
              unitTestsFailed.forEach(service => {
                body += `- **${service}** - [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
              });
              body += `\n`;
            }

            if (componentIntegrationFailed.length > 0) {
              body += `#### ❌ Component Integration Tests Failed\n`;
              componentIntegrationFailed.forEach(service => {
                body += `- **${service}** - [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
              });
              body += `\n`;
            }

            if (serviceIntegrationFailed.length > 0) {
              body += `#### ❌ Service Integration (E2E) Tests Failed\n`;
              serviceIntegrationFailed.forEach(service => {
                body += `- **${service}** - [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
              });
              body += `\n`;
            }

            // Información adicional
            body += `### 🔍 Next Steps\n\n`;
            body += `1. Review the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            body += `2. Check the specific failed jobs listed above\n`;
            body += `3. Fix the failing tests\n`;
            body += `4. Push the fixes to trigger a new CI run\n\n`;
            
            body += `### 📝 Job Status Details\n\n`;
            body += `| Job | Status |\n`;
            body += `|-----|--------|\n`;
            for (const [job, result] of Object.entries(jobResults)) {
              const emoji = result === 'success' ? '✅' : result === 'failure' ? '❌' : '⚠️';
              body += `| ${job} | ${emoji} ${result} |\n`;
            }

            body += `\n---\n`;
            body += `*This issue was automatically created by the CI pipeline.*`;

            // Crear el issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'ci-failure', 'automated']
            });

            console.log(`Created issue #${issue.data.number}: ${issue.data.html_url}`);
