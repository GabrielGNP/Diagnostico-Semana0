name: pedido-service - Unit Tests

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'Backend/pedido-service/**'
      - '.github/workflows/ci-unit-pedido.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'Backend/pedido-service/**'
      - '.github/workflows/ci-unit-pedido.yml'
  workflow_call:

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/pedido-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run unit tests
        run: mvn -B test

      - name: Generate test report
        if: always()
        run: mvn surefire-report:report-only

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pedido-service-test-results
          path: Backend/pedido-service/target/surefire-reports/

  create-issue-on-failure:
    name: Create Issue on Failure
    needs: [unit-tests]
    if: failure()
    uses: ./.github/workflows/create-issue-on-failure.yml
    with:
      test-type: 'unit'
      service-name: 'pedido'
      workflow-name: 'pedido-service - Unit Tests'
