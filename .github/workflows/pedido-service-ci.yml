name: CI - pedido-service

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('Backend/pedido-service/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and run tests
        working-directory: Backend/pedido-service
        run: mvn -B -DskipTests=false verify

      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: pedido-service-test-reports
          path: |
            Backend/pedido-service/target/surefire-reports/
            Backend/pedido-service/target/failsafe-reports/
            Backend/pedido-service/target/site/jacoco/


