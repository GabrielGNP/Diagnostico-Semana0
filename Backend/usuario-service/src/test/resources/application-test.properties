# Test Profile - Uses H2 in-memory database

# Application
spring.application.name=usuario-service
server.port=0
server.servlet.context-path=/api

# Logging - Minimal for tests
logging.level.root=WARN
logging.level.com.example.usuarioservice=DEBUG

# Persistence
app.persistence.type=jpa
app.persistence.cache.enabled=false

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Configuration for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable RabbitMQ auto-configuration for unit tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Jackson
spring.jackson.default-property-inclusion=non_null

# JSON persistence for tests
users.persistence.file=src/test/resources/users-test.json
