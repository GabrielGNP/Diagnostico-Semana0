# Application
spring.application.name=usuario-service
server.port=8081
server.servlet.context-path=/api

# Logging
logging.level.root=INFO
logging.level.com.example.usuarioservice=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# CORS
app.cors.allowed-origins=http://localhost:3001,http://localhost:3000,http://localhost:5173

# Persistence - Factory Pattern + Decorator Pattern
# Define qué implementación de IUserPersistence usar
# Actualmente soportado: json, jpa
app.persistence.type=jpa
users.persistence.file=src/main/resources/users.json

# Caché - Decorator Pattern
# Envuelve la persistencia con una capa de caché para mejorar rendimiento
# true: Activa el CachedUserPersistenceDecorator (búsquedas O(1))
# false: Usa persistencia directa sin caché (búsquedas O(n))
# Recomendación: true para producción, false solo si hay problemas de memoria
app.persistence.cache.enabled=true

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Jackson
spring.jackson.default-property-inclusion=non_null
