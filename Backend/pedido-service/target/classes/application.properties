# ========================================
# PEDIDO SERVICE - APPLICATION PROPERTIES
# ========================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=pedido-service

# ========================================
# PostgreSQL Database Configuration
# ========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Connection Pool Configuration (HikariCP - default in Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========================================
# RabbitMQ Configuration
# ========================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ========================================
# Logging Configuration
# ========================================
logging.level.root=INFO
logging.level.com.example.pedidoservice=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================================
# Jackson Configuration
# ========================================


# ========================================
# Migration Strategy (Legacy File Support)
# ========================================
# Set to 'true' to enable one-time migration from JSON files to PostgreSQL
# After migration is complete, set to 'false'
pedido.migration.enabled=${MIGRATION_ENABLED:false}
pedido.migration.json-file-path=${ORDERS_FILE:data/orders.json}
